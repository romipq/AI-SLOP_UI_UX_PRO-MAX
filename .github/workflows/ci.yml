name: CI — Certified Slop Verification ✨

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify-slop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Slop Intelligence Engine & Manifest Tests
        run: python3 -m unittest discover -s skills/ai-slop-ui-ux-pro-max/scripts/tests -v
      - name: Verify Showcase Achieves Grade S+ Slop Score
        run: python3 skills/ai-slop-ui-ux-pro-max/scripts/slop.py --audit examples/nexusflow-ai-showcase.html
      - name: Test CLI List Command
        run: node bin/cli.mjs list
