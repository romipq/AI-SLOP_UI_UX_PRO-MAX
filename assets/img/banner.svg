<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">AI-SLOP UI/UX PRO MAX</title>
  <desc id="desc">A dark banner with violet, pink and cyan glow, gradient typography, and a glass dashboard mockup.</desc>

  <defs>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4B5FD"/>
      <stop offset="32%" stop-color="#F0ABFC"/>
      <stop offset="62%" stop-color="#F9A8D4"/>
      <stop offset="100%" stop-color="#A5F3FC"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="55%" stop-color="#DB2777"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="violet">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pink">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
    <filter id="glowV" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <clipPath id="cardClip">
      <rect x="700" y="96" width="420" height="252" rx="26"/>
    </clipPath>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="420" fill="#0B0B14"/>
  <g filter="url(#soft)">
    <circle cx="150" cy="60" r="230" fill="url(#violet)"/>
    <circle cx="1070" cy="360" r="230" fill="url(#pink)"/>
    <circle cx="620" cy="430" r="190" fill="url(#cyan)"/>
  </g>
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- left column -->
  <g>
    <rect x="72" y="70" width="332" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <circle cx="94" cy="88" r="4.5" fill="#22D3EE"/>
    <text x="112" y="93" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2.1" fill="#D8D8F0">NEW · 100/100 PEAK SLOP</text>

    <text x="70" y="196" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="94" font-weight="800" letter-spacing="-4.5" fill="url(#tg)">AI-SLOP</text>
    <text x="72" y="262" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">UI/UX PRO MAX</text>

    <text x="74" y="307" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#A1A1C2">Gradients, glass, emoji, buzzwords — on purpose.</text>

    <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" letter-spacing="1.8" fill="#6B7280">
      <text x="74" y="349">L1 → L5 DIAL · 100-POINT RUBRIC · DE-SLOP GUIDE</text>
    </g>

    <!-- CTAs -->
    <rect x="72" y="356" width="192" height="46" rx="23" fill="url(#cta)"/>
    <text x="94" y="384" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Start for free  →</text>
    <rect x="278" y="356" width="164" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text x="300" y="384" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#D8D8F0">Read the skill</text>
  </g>

  <!-- right: glass dashboard mock -->
  <g>
    <rect x="700" y="96" width="420" height="252" rx="26" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <g clip-path="url(#cardClip)">
      <circle cx="1010" cy="130" r="120" fill="url(#violet)" opacity="0.25"/>
    </g>

    <!-- window dots -->
    <circle cx="722" cy="120" r="5" fill="#FF5F57"/>
    <circle cx="740" cy="120" r="5" fill="#FEBC2E"/>
    <circle cx="758" cy="120" r="5" fill="#28C840"/>
    <text x="1088" y="124" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="1.4" fill="#6B7280">v2.0</text>

    <!-- KPI cards -->
    <g>
      <rect x="722" y="142" width="112" height="62" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="736" y="162" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="1.2" fill="#6B7280">AGENTS</text>
      <text x="736" y="189" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">1,284</text>

      <rect x="844" y="142" width="112" height="62" rx="13" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
      <text x="858" y="162" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="1.2" fill="#6B7280">HOURS SAVED</text>
      <text x="858" y="189" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">9,412</text>

      <rect x="966" y="142" width="132" height="62" rx="13" fill="url(#cta)" fill-opacity="0.28" stroke="#A855F7" stroke-opacity="0.45"/>
      <text x="980" y="162" font-family="Inter, Arial, sans-serif" font-size="9" letter-spacing="1.2" fill="#C4B5FD">SLOP SCORE</text>
      <text x="980" y="190" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="url(#tg)">100</text>
    </g>

    <!-- chart -->
    <rect x="722" y="216" width="376" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M722 306 C760 298 790 272 828 278 866 284 890 250 926 254 962 258 986 232 1022 238 1054 243 1070 226 1098 220 L1098 328 L722 328 Z" fill="url(#fill)"/>
    <path d="M722 306 C760 298 790 272 828 278 866 284 890 250 926 254 962 258 986 232 1022 238 1054 243 1070 226 1098 220" fill="none" stroke="url(#line)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1098" cy="220" r="4" fill="#EC4899" filter="url(#glowV)"/>

    <!-- floating badge -->
    <g>
      <rect x="946" y="70" width="194" height="38" rx="19" fill="url(#cta)"/>
      <text x="966" y="94" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✦ Peak slop</text>
      <text x="1074" y="94" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FFFFFF" fill-opacity="0.8">100/100</text>
    </g>
  </g>

  <!-- corner caption -->
  <text x="1128" y="392" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="2" fill="#4B5563">NEBULAFLOW.DEV / SLOP</text>
</svg>
